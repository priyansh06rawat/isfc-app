name: Build React Native Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create Env File
        run: |
          echo "EXPO_PUBLIC_SF_LOGIN_URL=https://orgfarm-6ebfdf48c8-dev-ed.develop.my.salesforce.com" >> .env
          echo "EXPO_PUBLIC_SF_INSTANCE_URL=https://orgfarm-6ebfdf48c8-dev-ed.develop.my.salesforce.com" >> .env
          echo "EXPO_PUBLIC_SF_CLIENT_ID=${{ secrets.EXPO_PUBLIC_SF_CLIENT_ID }}" >> .env
          echo "EXPO_PUBLIC_SF_CLIENT_SECRET=${{ secrets.EXPO_PUBLIC_SF_CLIENT_SECRET }}" >> .env


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Native Android Code
        run: npx expo prebuild --platform android --clean

      - name: Ensure Debug Keystore Exists
        working-directory: android/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
