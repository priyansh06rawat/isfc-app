name: Build React Native Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Auto-cancel any in-progress run when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      # Fix OOM Metaspace — enforced for all Gradle tasks in this workflow
      GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
      JAVA_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create Env File
        run: |
          echo "EXPO_PUBLIC_SF_LOGIN_URL=https://isfc.my.salesforce.com" >> .env
          echo "EXPO_PUBLIC_SF_INSTANCE_URL=https://isfc.my.salesforce.com" >> .env
          echo "EXPO_PUBLIC_SF_CLIENT_ID=${{ secrets.EXPO_PUBLIC_SF_CLIENT_ID }}" >> .env
          echo "EXPO_PUBLIC_SF_CLIENT_SECRET=${{ secrets.EXPO_PUBLIC_SF_CLIENT_SECRET }}" >> .env

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set Android SDK Permissions
        run: chmod +x android/gradlew

      - name: Ensure Debug Keystore Exists
        working-directory: android/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi

      - name: Build Android APK (arm64-v8a)
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Porg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
